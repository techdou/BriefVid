[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-lecture-skill"
version = "0.2.0"
description = "Video to lecture notes, mindmap, knowledge base and Obsidian export skill for AI agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "yt-dlp>=2024.4",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.20",
]
knowledge = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mcp>=1.20",
]

[project.scripts]
video-lecture = "video_lecture_skill.cli:main"

[project.entry-points."mcp.servers"]
video-lecture = "mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_lecture_skill"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
