[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-lecture-skill"
version = "0.1.0"
description = "Video to lecture notes and mindmap skill for AI agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "yt-dlp>=2024.4",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
video-lecture = "video_lecture_skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_lecture_skill"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
