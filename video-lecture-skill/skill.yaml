name: video-lecture
version: 0.2.0
api_version: "v2"
entry_point: video_lecture_skill.api:app
cli_entry: video_lecture_skill.cli:main
config_prefix: VLEC_
mcp_entry: mcp_server:main
requires:
  runtime:
    - python>=3.11
  tools:
    - ffmpeg
  optional:
    - chromadb>=0.4
    - sentence-transformers>=2.2
capabilities:
  - id: video_download
    platforms: [bilibili, youtube, douyin, generic, local]
  - id: audio_transcription
    modes: [local, cloud]
  - id: lecture_generation
    formats: [markdown, json]
  - id: mindmap_generation
    formats: [mermaid, json]
  - id: multi_format_export
  - id: progress_tracking
  - id: error_recovery
  - id: knowledge_base_rag
    requires: [chromadb, sentence-transformers]
  - id: knowledge_search
  - id: knowledge_qa
  - id: auto_tagging
  - id: tag_network
  - id: multi_page_video
  - id: aggregate_summary
  - id: resummary
  - id: obsidian_export
  - id: local_video_upload
parameters:
  url:
    type: string
    required: true
  title:
    type: string
    required: false
  language:
    type: string
    default: "zh"
    enum: [zh, en, ja, ko, auto]
  output_formats:
    type: array
    default: [markdown, mermaid, json]
  transcribe_mode:
    type: string
    enum: [local, cloud]
  page_number:
    type: integer
  task_ids:
    type: string
  query:
    type: string
  tags:
    type: string
outputs:
  - lecture_md
  - mindmap_mermaid
  - transcript
  - result_json
  - artifacts
  - obsidian_note
  - knowledge_search_results
  - knowledge_answer
  - tag_network
errors:
  - code: DOWNLOAD_ERROR
    recoverable: true
  - code: TRANSCRIBE_ERROR
    recoverable: true
  - code: LLM_ERROR
    recoverable: true
  - code: UNSUPPORTED_PLATFORM
    recoverable: false
  - code: TIMEOUT
    recoverable: true
  - code: KNOWLEDGE_NOT_ENABLED
    recoverable: true
  - code: KNOWLEDGE_DEPENDENCY_MISSING
    recoverable: true
  - code: TASK_NOT_FOUND
    recoverable: false
limits:
  max_video_duration_seconds: 7200
  max_transcript_chars: 500000
  max_lecture_sections: 20
  max_concurrent_tasks: 5
  max_knowledge_search_results: 50
  max_tag_network_nodes: 50
